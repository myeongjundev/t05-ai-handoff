name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 살린다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 인계 순서와 분할 커밋도 검증하므로 전체 기록이 필요하다.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify handoff evidence
        run: npm run verify:handoff:evidence

      # 브라우저는 버전마다 경로가 달라서 버전을 키에 넣는다. 그러지 않으면
      # playwright 를 올린 뒤에도 옛 브라우저 캐시를 복원해 설치가 깨진다.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 문서·커밋 증거, 단위 85개, build, 실제 Chromium 38개를 한 명령으로
      # 검증한다. 개수가 정확히 일치해야 하며 성공 결과는 Actions 요약과
      # 배포용 handoff-verification.json으로 남는다.
      - name: Verify handoff end to end
        run: npm run verify:handoff

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
